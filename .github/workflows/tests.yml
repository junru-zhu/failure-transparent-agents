name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install setuptools==75.8.0
      - run: make check-dataset
      - run: make test
      - run: make preflight
      - run: make full-scale-validation
      - run: make release-audit
      - run: make release-wheel
